[project]
name = "fast-api-demo"
version = "0.1.0"
description = "Demonstrate use of FastAPI from basics to advanced."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "isort>=9.0.1",
    "logging>=0.4.9.6",
    "passlib[argon2]>=1.7.4",
    "pydantic[email]>=2.13.5",
    "pytest>=9.1.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.0",
    "uvicorn>=0.53.0",
]
[tool.black]
target-version = ['py313']


